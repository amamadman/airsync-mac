name: Build AirSync Self Compiled

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode 26
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.3'

    - name: Build
      run: |
        xcodebuild -scheme 'AirSync Self Compiled' \
          -destination 'generic/platform=macOS' \
          build \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGN_STYLE=Manual \
          DEVELOPMENT_TEAM=""

    - name: Locate app
      id: locate
      run: |
        APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "AirSync.app" -path "*/Build/Products/*" | head -1)
        echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
        echo "Found: $APP_PATH"

    - name: Upload AirSync.app
      uses: actions/upload-artifact@v4
      with:
        name: AirSync
        path: ${{ steps.locate.outputs.app_path }}
