name: Swift Build and Release
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Build Release
      run: |
        xcodebuild -scheme 'AirSync Self Compiled' -configuration Release -destination 'platform=macOS,arch=x86_64' clean build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ENABLE_ASSETCATALOG_THINNING=NO ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT=YES 2>&1 | tail -50
    - name: Archive Release Build Artifacts
      if: success()
      run: |
        BUILD_DIR=$(xcodebuild -scheme 'AirSync Self Compiled' -configuration Release -destination 'platform=macOS,arch=x86_64' -showBuildSettings | grep -m 1 BUILD_DIR | awk '{print $3}')
        mkdir -p build-artifacts/Release
        cp -R "$BUILD_DIR/Release/"* build-artifacts/Release/
      shell: bash
    - name: Upload Release Build Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: AirSync-Release
        path: build-artifacts/Release