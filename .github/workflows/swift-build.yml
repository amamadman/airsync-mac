name: Swift Build and Release
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Build Release
      run: |
        xcodebuild -scheme 'AirSync Self Compiled' -configuration Release clean build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO | xcpretty

    - name: Archive Release Build Artifacts
      if: success()
      run: |
        mkdir -p build-artifacts/Release
        cp -R "$(xcodebuild -scheme 'AirSync Self Compiled' -configuration Release -showBuildSettings | grep -m 1 BUILD_DIR | awk '{print $3}')/Release/"* build-artifacts/Release/
      shell: bash
      
    - name: Upload Release Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AirSync-Release
        path: build-artifacts/Release
